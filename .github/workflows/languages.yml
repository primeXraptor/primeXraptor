name: Refresh language card

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - scripts/update_languages.py
      - .github/workflows/languages.yml

permissions:
  contents: write

concurrency:
  group: language-card
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate aggregate card
        env:
          PRIVATE_STATS_TOKEN: ${{ secrets.PRIVATE_STATS_TOKEN }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/update_languages.py
      - name: Commit updated card
        run: |
          git add assets/top-languages.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh language card'
          git push
